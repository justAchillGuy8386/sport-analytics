name: Scheduled Football Data Sync to Supabase

on:
  schedule:
    # 1. Khung giờ Cao Điểm Đêm 10 phút/lần
    - cron: '*/10 11-23 * * *'
    
    # 2. Khung giờ Ban Ngày 2 tiếng/lần
    - cron: '0 0-10,23 * * *'

  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub bất kỳ lúc nào

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync API-Football Matches to Supabase
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/sync-to-supabase.js
